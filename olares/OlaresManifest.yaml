olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  theresg: 1

metadata:
  name: theresg
  title: ThereSG
  description: Singapore bus arrivals, bus routes and train service alerts in one web app
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  version: 0.1.1
  categories:
    - Utilities

entrances:
  - name: theresg
    host: theresg
    port: 3000
    title: ThereSG
    icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
    authLevel: public
    openMethod: default

middleware:
  postgres:
    username: theresg
    databases:
      - name: theresgquota
        scripts:
          - CREATE TABLE IF NOT EXISTS lta_daily_budget (day date PRIMARY KEY, calls integer NOT NULL CHECK (calls >= 0));

envs:
  - envName: NUXT_DATAMALL_API_KEY
    required: true
    type: password
    editable: true

spec:
  versionName: '0.1.1'
  requiredCpu: 250m
  limitedCpu: 1000m
  requiredMemory: 256Mi
  limitedMemory: 512Mi
  requiredDisk: 128Mi
  supportArch:
    - amd64
    - arm64
  fullDescription: |
    Singapore bus arrivals, bus routes and train service alerts in one web app using the LTA DataMall API.
  upgradeDescription: |
    Initial release.
  developer: Soong Chee Gi
  website: https://github.com/gisc/theresg
  sourceCode: https://github.com/gisc/theresg
  locale:
    - en-US
options:
  dependencies:
    - name: olares
      version: ">=1.12.6-0"
      type: system
