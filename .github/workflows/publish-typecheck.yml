name: Publish typecheck patch (temporary)
on:
  workflow_dispatch:
    inputs:
      merge:
        description: "Fast-forward main and start Docker build"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PATCH_B64: 
      PATCH_SHA256: 42be74121920e4bff622749e5b1ea63cca087c4be6ad51ee686bae401ee83b72
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch (package.json and package-lock.json only)
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/p.patch
          echo "$PATCH_SHA256  /tmp/p.patch" | sha256sum -c -
          git apply --numstat /tmp/p.patch
          git apply /tmp/p.patch
          git status --short
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Commit to branch
        run: |
          git config user.name gisc
          git config user.email "gisc@users.noreply.github.com"
          git checkout -B typecheck-patch
          git add package.json package-lock.json
          git commit -m "Add typecheck script and dev dependencies"
          git push -f origin typecheck-patch
      - name: Fast-forward main and start build
        if: ${{ inputs.merge }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin typecheck-patch:main
          gh workflow run docker.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
