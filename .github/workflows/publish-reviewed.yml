name: Publish approved ThereSG changes (temporary)
on:
  workflow_dispatch:
    inputs:
      change:
        description: Reviewed change
        type: choice
        options: [haze, lorong, food]
      merge:
        description: Merge checked change and start Docker build
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply the selected reviewed patch
        env:
          CHANGE: ${{ inputs.change }}
        run: |
          case "$CHANGE" in
            haze) B=''; S='ab66d3fa81a29cf15cb6f0ad33f55686ab3bd79b87ab501ccf7aaa1fda63821d' ;;
            lorong) B=''; S='39cb3728df8b4f83fff3b939cc3f80a1ee174b276814f5605529947ef3f0fe1b' ;;
            food) B=''; S='fd15859da9fe57000058f1ca90d36f3b9acb325f312e38ac2b23771285018be6' ;;
            *) exit 1 ;;
          esac
          printf '%s' "$B" | base64 -d | gzip -d > /tmp/change.patch
          echo "$S  /tmp/change.patch" | sha256sum -c -
          git apply --check /tmp/change.patch
          git apply /tmp/change.patch
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit reviewed change on its branch
        env:
          CHANGE: ${{ inputs.change }}
        run: |
          git config user.name gisc
          git config user.email gisc@users.noreply.github.com
          git checkout -B "reviewed-$CHANGE"
          git add -- app public server shared tests
          git commit -m "Add reviewed $CHANGE change"
          git push --force-with-lease origin "reviewed-$CHANGE"
      - name: Merge and start existing Docker build
        if: ${{ inputs.merge }}
        env:
          CHANGE: ${{ inputs.change }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin "reviewed-$CHANGE:main"
          gh workflow run docker.yml --ref main
